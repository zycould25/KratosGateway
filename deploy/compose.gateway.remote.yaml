# Standalone gateway on Mac mini. Its .env needs HUB_LAN_URL, LAN_TOKEN and
# optionally GATEWAY_HTTP_PORT/GATEWAY_POSTGRES_PORT. It stores no file/DB data.
services:
  traefik:
    image: traefik:v3.7.14
    restart: unless-stopped
    command:
      - --providers.http.endpoint=${HUB_LAN_URL:?set HUB_LAN_URL}/v1/traefik
      - --providers.http.pollInterval=5s
      - --providers.http.pollTimeout=5s
      - "--providers.http.headers.Authorization=Bearer ${LAN_TOKEN:?set LAN_TOKEN}"
      - --entryPoints.web.address=:80
      - --entryPoints.web.transport.respondingTimeouts.readTimeout=0
      - --entryPoints.postgres.address=:5432
      - --accesslog=true
      - --log.level=INFO
    ports:
      - "${GATEWAY_HTTP_PORT:-8088}:80"
      - "${GATEWAY_POSTGRES_PORT:-15432}:5432"
