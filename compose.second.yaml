# Run this file on the second Docker host after preparing .env.second.
services:
  node:
    build: .
    restart: unless-stopped
    environment:
      ROLE: node
      LAN_TOKEN: ${LAN_TOKEN:?set LAN_TOKEN}
      NODE_ID: ${NODE_ID:?set NODE_ID}
      FILE_URL: http://${LAN_IP:?set LAN_IP}:8081
      HUB_URL: http://${HUB_IP:?set HUB_IP}:8080
      DATA_DIR: /data
      REPLICA_COUNT: 2
      MINIO_URL: http://${LAN_IP}:9000
      MINIO_CONSOLE_URL: http://${LAN_IP}:9001
      POSTGRES_ADDRESS: ${LAN_IP}:5432
      POSTGRES_PROBE_USER: kratos_probe
      POSTGRES_PROBE_PASSWORD: ${POSTGRES_PROBE_PASSWORD:?set POSTGRES_PROBE_PASSWORD}
      POSTGRES_PROBE_DATABASE: ${POSTGRES_DB:-app}
      POSTGRES_PROBE_SSLMODE: prefer
      HTTP_ADDR: :8080
    volumes:
      - ${DATA_ROOT:?set DATA_ROOT}/files:/data
    ports:
      - "8081:8080"

  postgres-standby:
    image: postgres:17-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/opt/init-standby.sh"]
    environment:
      PGDATA: /var/lib/postgresql/data
      PG_PRIMARY_HOST: ${PRIMARY_IP:?set PRIMARY_IP}
      PG_PRIMARY_PORT: 5432
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:?set REPLICATION_PASSWORD}
    volumes:
      - ${DATA_ROOT}/postgres:/var/lib/postgresql/data
      - ./deploy/postgres-standby.sh:/opt/init-standby.sh:ro
    ports:
      - "5432:5432"

  minio:
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes:
      - ${DATA_ROOT}/minio:/data
    ports:
      - "9000:9000"
      - "9001:9001"
