services:
  hub:
    build: .
    restart: unless-stopped
    environment:
      ROLE: hub
      LAN_TOKEN: ${LAN_TOKEN:?set LAN_TOKEN}
      ADVERTISE_URL: http://${LAN_IP:?set LAN_IP}:8080
      HTTP_ADDR: :8080
      GATEWAY_HUB_URL: ${GATEWAY_HUB_URL:-http://${LAN_IP}:8080}
      GATEWAY_DOMAIN: ${GATEWAY_DOMAIN:-kratos.internal}
      GATEWAY_HTTP_ENTRYPOINT: ${GATEWAY_HTTP_ENTRYPOINT:-web}
      GATEWAY_POSTGRES_ENTRYPOINT: ${GATEWAY_POSTGRES_ENTRYPOINT:-postgres}
      GATEWAY_MINIO_NODE_ID: ${GATEWAY_MINIO_NODE_ID:-storage-1}
      GATEWAY_TLS: ${GATEWAY_TLS:-false}
      GATEWAY_CERT_RESOLVER: ${GATEWAY_CERT_RESOLVER:-}
    ports:
      - "8080:8080"
      - "39471:39471/udp"

  node:
    build: .
    restart: unless-stopped
    depends_on:
      - hub
    environment:
      ROLE: node
      LAN_TOKEN: ${LAN_TOKEN:?set LAN_TOKEN}
      NODE_ID: ${NODE_ID:?set NODE_ID}
      FILE_URL: http://${LAN_IP:?set LAN_IP}:8081
      HUB_URL: http://hub:8080
      DATA_DIR: /data
      REPLICA_COUNT: ${REPLICA_COUNT:-1}
      MINIO_URL: http://${LAN_IP}:9000
      MINIO_CONSOLE_URL: http://${LAN_IP}:9001
      POSTGRES_ADDRESS: ${LAN_IP}:5432
      POSTGRES_PROBE_USER: kratos_probe
      POSTGRES_PROBE_PASSWORD: ${POSTGRES_PROBE_PASSWORD:?set POSTGRES_PROBE_PASSWORD}
      POSTGRES_PROBE_DATABASE: ${POSTGRES_DB}
      POSTGRES_PROBE_SSLMODE: prefer
      HTTP_ADDR: :8080
    volumes:
      - ${DATA_ROOT:?set DATA_ROOT}/files:/data
    ports:
      - "8081:8080"

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:?set REPLICATION_PASSWORD}
      REPLICATION_CIDR: ${REPLICATION_CIDR:?set REPLICATION_CIDR}
      POSTGRES_PROBE_PASSWORD: ${POSTGRES_PROBE_PASSWORD:?set POSTGRES_PROBE_PASSWORD}
    command: ["postgres", "-c", "listen_addresses=*", "-c", "wal_level=replica", "-c", "max_wal_senders=10", "-c", "max_replication_slots=10", "-c", "wal_keep_size=1GB"]
    volumes:
      - ${DATA_ROOT}/postgres:/var/lib/postgresql/data
      - ./deploy/postgres-primary-init.sh:/docker-entrypoint-initdb.d/01-replication.sh:ro
      - ./deploy/postgres-probe-init.sh:/opt/postgres-probe-init.sh:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes:
      - ${DATA_ROOT}/minio:/data
    ports:
      - "9000:9000"
      - "9001:9001"
